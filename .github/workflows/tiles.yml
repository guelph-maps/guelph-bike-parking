name: Build base map tiles

# Every Monday, next to the data check, and by hand. The result is a draft data
# release: beta picks it up at once, and publishing the draft puts it live. Phones
# with a saved copy don't fetch every new file, only one that's a month newer
# than theirs (js/basemap.js), so a weekly build doesn't mean 3 MB a week each.
# A scheduled week whose tiles match the last file's publishes nothing.
on:
  schedule:
    - cron: '17 23 * * 1' # Mondays, 23:17 UTC: early evening in Guelph
  workflow_dispatch:

concurrency:
  group: tiles
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Get the last tile file, to compare with
        run: |
          scripts/get-tiles.sh
          if [ -f build/guelph.pmtiles ]; then mv build/guelph.pmtiles build/last-release.pmtiles; fi
      - name: Build the tiles from Geofabrik's Ontario extract
        env:
          PLANETILER_JAR: build/planetiler.jar
          PLANETILER_JAVA_OPTS: -Xmx6g
        run: |
          mkdir -p build
          curl -sSfL -o build/planetiler.jar https://github.com/onthegomap/planetiler/releases/download/v0.10.2/planetiler.jar
          echo "f310bd0413e2e4512b27f4046d418664e8e1d3bf31603c2a70e23de06c167e4d  build/planetiler.jar" | sha256sum -c -
          curl -sSfL -o build/ontario.osm.pbf https://download.geofabrik.de/north-america/canada/ontario-latest.osm.pbf
          node scripts/build-tiles.mjs build/ontario.osm.pbf
      # Each build has a new file name (it carries the OSM date), so compare the tiles.
      - name: Check whether the tiles changed
        id: diff
        run: |
          result=$(node scripts/tiles-changed.mjs build/last-release.pmtiles build/guelph.pmtiles)
          echo "Tiles since the last file: $result"
          publish=yes
          if [ "$result" = same ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            publish=no
            echo "::notice title=No new base map::The tiles match the last file; nothing published."
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Save them as a draft data release
        id: release
        if: steps.diff.outputs.publish == 'yes'
        run: |
          tag="data-$(date -u +%F)"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Only a person may change what an already published release puts live.
            draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$draft" != true ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
              echo "::warning title=Release already published::$tag is published; next week's build will try again."
              exit 0
            fi
            gh release upload "$tag" build/guelph.pmtiles --repo "$GITHUB_REPOSITORY" --clobber
          else
            # Targeting the branch, not this commit: a draft gets its tag when it's
            # published, so the parking data that goes live with these tiles is
            # main's at that moment, including a data refresh merged in between.
            gh release create "$tag" build/guelph.pmtiles --draft --target main --title "$tag" \
              --notes 'New base map. Publishing this puts it live with the map data on main at that moment.'
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'guelph.pmtiles'
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # One waiting base map is enough: drop the older drafts this workflow made, so
      # whoever publishes picks the newest. By id, since a draft can share its tag.
      - name: Drop older base map drafts
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "
            .[] | select(.draft) | select(.tag_name | startswith(\"data-\")) | select(.tag_name != \"$TAG\")
                | select((.body // \"\") | startswith(\"New base map\"))
                | select(any(.assets[]; .name == \"guelph.pmtiles\"))
                | \"\(.id) \(.tag_name)\"" |
          while read -r id name; do
            echo "Deleting the older draft $name"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
      # Actions can't set off other workflows by creating a release, only by asking.
      - name: Update the beta site
        if: steps.release.outputs.tag != ''
        run: gh workflow run deploy.yml --ref main
