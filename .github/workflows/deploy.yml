name: Deploy map to GitHub Pages

on:
  push:
  schedule:
    - cron: '17 9 * * 1' # Mondays, 09:17 UTC: refresh the OpenStreetMap data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Pushes publish only from the default branch, whatever it's called.
    # (Scheduled runs always use the default branch.)
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download fresh bike parking data from OpenStreetMap
        # If Overpass is down or slow, publish the copy committed in data/ instead.
        run: node scripts/fetch-data.mjs data
        timeout-minutes: 6
        continue-on-error: true
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html embed.html favicon.svg css js data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
