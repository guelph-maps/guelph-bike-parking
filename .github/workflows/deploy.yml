name: Deploy site

# Merges to main update the beta site. The production site only changes when someone
# publishes a release: v* for the app, data-* for the data. Run by hand with a pull
# request number, it puts that pull request on beta until the next merge replaces it.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Beta only: pull request number to put on beta instead of main (run from main)'
        required: false
      tiles:
        description: 'Beta pull request only: build the base map from the pull request too (a few minutes longer)'
        type: boolean
        default: false
      app:
        description: 'Production only: app release to publish, to go back to an older one (default: the latest)'
        required: false
      data:
        description: 'Production only: data release to publish, to go back to an older one (default: the latest)'
        required: false

permissions:
  contents: read

jobs:
  beta:
    if: github.ref_name == github.event.repository.default_branch && !inputs.pr
    runs-on: ubuntu-latest
    permissions:
      contents: write # listing draft releases needs it; nothing here writes to this repo
    concurrency:
      group: beta
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release stamp reads the history and the tags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get the base map
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/get-tiles.sh
      - name: Keep the base map that's live now, for pages still streaming it
        run: scripts/get-live-tiles.sh https://beta.guelph.bike
      - name: Collect site files
        run: |
          scripts/build-site.sh HEAD HEAD
          node scripts/mark-beta.mjs _site
      - name: Publish to the beta site
        env:
          BETA_DEPLOY_KEY: ${{ secrets.BETA_DEPLOY_KEY }}
          BETA_DEPLOY_KEY_PASSPHRASE: ${{ secrets.BETA_DEPLOY_KEY_PASSPHRASE }}
        run: scripts/publish-beta.sh _site "Beta build of $GITHUB_SHA"

  # A pull request on beta, by hand: its app and data, and its base map if asked. Its
  # code runs here, in a job that never sees the deploy key; only the built site goes
  # on to the publishing job, which runs this file's own scripts. Branches of this
  # repository only: a fork's code would run with this repository's token.
  beta-pr-build:
    if: inputs.pr
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # listing draft releases needs it; nothing here writes to this repo
      pull-requests: read
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error title=Not a pull request number::Expected a number like 31, got '$PR'."
            exit 1
          fi
          info=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json state,isCrossRepository,headRefOid --jq '"\(.state) \(.isCrossRepository) \(.headRefOid)"')
          read -r state fork sha <<< "$info"
          if [ "$fork" != false ]; then
            echo "::error title=Pull request from a fork::#$PR comes from a fork, and its code would run with this repository's token. Push its branch here first."
            exit 1
          fi
          if [ "$state" != OPEN ]; then
            echo "::error title=Pull request not open::#$PR is $state."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building #$PR at $sha"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0 # the release stamp reads the history and the tags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        if: inputs.tiles
        with:
          distribution: temurin
          java-version: 21
      - name: Get the base map
        if: ${{ !inputs.tiles }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/get-tiles.sh
      # The same steps as tiles.yml; keep the Planetiler version in step with it.
      - name: Build the base map from the pull request
        if: inputs.tiles
        env:
          PLANETILER_JAR: build/planetiler.jar
          PLANETILER_JAVA_OPTS: -Xmx6g
        run: |
          mkdir -p build
          curl -sSfL -o build/planetiler.jar https://github.com/onthegomap/planetiler/releases/download/v0.10.2/planetiler.jar
          echo "f310bd0413e2e4512b27f4046d418664e8e1d3bf31603c2a70e23de06c167e4d  build/planetiler.jar" | sha256sum -c -
          curl -sSfL -o build/ontario.osm.pbf https://download.geofabrik.de/north-america/canada/ontario-latest.osm.pbf
          node scripts/build-tiles.mjs build/ontario.osm.pbf
      # A branch from before this script existed just deploys without the old file.
      - name: Keep the base map that's live now, for pages still streaming it
        run: if [ -x scripts/get-live-tiles.sh ]; then scripts/get-live-tiles.sh https://beta.guelph.bike; fi
      - name: Collect site files
        run: |
          scripts/build-site.sh HEAD HEAD
          node scripts/mark-beta.mjs _site
      # "0.1.3-dev.abc1234" becomes "0.1.3-dev.abc1234.pr31": About links to the pull
      # request, and the app cache gets a name of its own.
      - name: Put the pull request number in the version
        env:
          PR: ${{ inputs.pr }}
        run: |
          if grep -q "^var BUILD = '[^']*-dev\.[0-9a-f]*';" _site/sw.js; then
            sed -i "s/^var BUILD = '\([^']*\)';/var BUILD = '\1.pr$PR';/" _site/sw.js
            grep "^var BUILD = " _site/sw.js
          else
            echo "::warning title=Version not marked::Couldn't find the build version in sw.js; About won't name #$PR."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: beta-site
          path: _site
          include-hidden-files: true # .nojekyll
          retention-days: 1

  beta-pr-publish:
    needs: beta-pr-build
    runs-on: ubuntu-latest
    concurrency:
      group: beta
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: beta-site
          path: _site
      - name: Publish to the beta site
        env:
          BETA_DEPLOY_KEY: ${{ secrets.BETA_DEPLOY_KEY }}
          BETA_DEPLOY_KEY_PASSPHRASE: ${{ secrets.BETA_DEPLOY_KEY_PASSPHRASE }}
          PR: ${{ inputs.pr }}
          SHA: ${{ needs.beta-pr-build.outputs.sha }}
        run: |
          scripts/publish-beta.sh _site "Beta build of pull request #$PR at $SHA"
          echo "Pull request #$PR ($SHA) is on https://beta.guelph.bike/ until the next merge to main." >> "$GITHUB_STEP_SUMMARY"

  # The github-pages environment only accepts v* and data-* tags, so GitHub itself
  # refuses a run of this job from main, whatever this file says.
  production:
    if: github.ref_type == 'tag' && (startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'data-')) && !inputs.pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false # a merge or a second release must never cut off a release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the app and the data can come from different tags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick the app and data releases
        id: pick
        env:
          APP: ${{ inputs.app }}
          DATA: ${{ inputs.data }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          app=${APP:-}
          data=${DATA:-}
          if [[ "$REF_NAME" == v* ]] && [ -z "$app" ]; then app="$REF_NAME"; fi
          # Always the newest data, even when an older draft was just published, so a
          # late publish can't roll the racks back. Use the data input to go back on purpose.
          if [ -z "$app" ]; then app=$(git tag --list 'v*' --sort=-v:refname | head -1); fi
          if [ -z "$data" ]; then data=$(git tag --list 'data-*' --sort=-v:refname | head -1); fi
          if [ -z "$app" ] || [ -z "$data" ]; then
            echo "::error title=Nothing to publish::The production site needs an app release and a data release."
            exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "data=$data" >> "$GITHUB_OUTPUT"
      - name: Get the base map
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/get-tiles.sh "${{ steps.pick.outputs.data }}"
      - name: Keep the base map that's live now, for pages still streaming it
        run: scripts/get-live-tiles.sh https://guelph.bike
      - uses: actions/configure-pages@v5
      - name: Collect site files
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ steps.pick.outputs.app }}
          DATA: ${{ steps.pick.outputs.data }}
        run: |
          # The menu shows the day the app was released, in Guelph's time. The same
          # date on every deploy of a release keeps sw.js unchanged between them.
          published=$(gh release view "$APP" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt // empty' 2>/dev/null || true)
          released=""
          if [ -n "$published" ]; then
            released=$(node -e 'console.log(new Date(process.argv[1]).toLocaleDateString("en-CA", { timeZone: "America/Toronto" }))' "$published")
          fi
          scripts/build-site.sh "$APP" "$DATA" "$released"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test the production site
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for i in $(seq 1 20); do
            if curl -fsSL --max-time 10 "$url" | grep -q 'Guelph Bike Parking Map'; then
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Production site check failed::The production site did not serve the expected app HTML."
          exit 1
