name: Deploy map to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Branch head, so a call from update-data.yml includes its new commit.
          ref: ${{ github.ref }}
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html embed.html favicon.svg css js vendor data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
