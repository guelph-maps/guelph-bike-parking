name: Deploy map to GitHub Pages

on:
  push:
  schedule:
    - cron: '17 9 * * 1' # Mondays, 09:17 UTC: refresh the OpenStreetMap data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Pushes publish only from the default branch, whatever it's called.
    # (Scheduled runs always use the default branch.)
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release stamp below reads the history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download fresh bike parking data from OpenStreetMap
        id: fetch
        # If Overpass is down or slow, publish the copy committed in data/ instead.
        run: node scripts/fetch-data.mjs data
        timeout-minutes: 12
        continue-on-error: true
      # The bike base map is rebuilt once a month (or when the schema changes)
      # from Geofabrik's Ontario extract; other deploys reuse the cached file.
      - name: Pick this month's tile cache key
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore base map tiles
        id: tiles
        uses: actions/cache/restore@v4
        with:
          path: build/guelph.pmtiles
          key: tiles-${{ hashFiles('scripts/tiles/schema.yml', 'scripts/build-tiles.mjs') }}-${{ steps.month.outputs.month }}
          restore-keys: |
            tiles-${{ hashFiles('scripts/tiles/schema.yml', 'scripts/build-tiles.mjs') }}-
            tiles-
      - uses: actions/setup-java@v4
        if: steps.tiles.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 21
      - name: Build base map tiles
        id: build-tiles
        if: steps.tiles.outputs.cache-hit != 'true'
        # On failure, publish the older tiles restored above (if any).
        continue-on-error: true
        timeout-minutes: 20
        env:
          PLANETILER_JAR: build/planetiler.jar
          PLANETILER_JAVA_OPTS: -Xmx6g
        run: |
          mkdir -p build
          [ -f build/guelph.pmtiles ] && cp build/guelph.pmtiles build/previous.pmtiles
          curl -sSfL -o build/planetiler.jar https://github.com/onthegomap/planetiler/releases/download/v0.10.2/planetiler.jar
          echo "f310bd0413e2e4512b27f4046d418664e8e1d3bf31603c2a70e23de06c167e4d  build/planetiler.jar" | sha256sum -c -
          curl -sSfL -o build/ontario.osm.pbf https://download.geofabrik.de/north-america/canada/ontario-latest.osm.pbf
          if ! node scripts/build-tiles.mjs build/ontario.osm.pbf; then
            [ -f build/previous.pmtiles ] && mv build/previous.pmtiles build/guelph.pmtiles
            exit 1
          fi
          rm -f build/ontario.osm.pbf build/previous.pmtiles
      - name: Save base map tiles
        if: steps.build-tiles.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: build/guelph.pmtiles
          key: ${{ steps.tiles.outputs.cache-primary-key }}
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir _site
          app="index.html embed.html favicon.svg manifest.webmanifest sw.js icons vendor css js"
          cp -r $app data _site/
          # A new cache name per release, so phones pick up the new app files. Only
          # commits to the app count: a data refresh must leave sw.js byte-identical,
          # or every phone downloads the app again and is told there's a new version.
          build="$(git log -1 --format=%h --abbrev=12 -- $app)-$(git rev-list --count HEAD -- $app)"
          sed -i "s/__BUILD__/$build/" _site/sw.js
          # Without tiles the map falls back to OpenStreetMap's street map.
          if [ -f build/guelph.pmtiles ]; then node scripts/publish-tiles.mjs _site/tiles; fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      # The site is up, but on the committed data, so end red rather than look fresh.
      - name: Report a failed data refresh
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error title=Stale map data::Overpass failed, so this deploy published the copy committed in data/."
          exit 1
