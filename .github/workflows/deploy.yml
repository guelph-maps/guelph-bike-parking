name: Deploy site

# Merges to main update the beta site. The production site only changes when someone
# publishes a release: v* for the app, data-* for the data.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      app:
        description: 'Production only: app release to publish, to go back to an older one (default: the latest)'
        required: false
      data:
        description: 'Production only: data release to publish, to go back to an older one (default: the latest)'
        required: false

permissions:
  contents: read

jobs:
  beta:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write # listing draft releases needs it; nothing here writes to this repo
    concurrency:
      group: beta
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release stamp reads the history and the tags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get the base map
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/get-tiles.sh
      - name: Collect site files
        run: |
          scripts/build-site.sh HEAD HEAD
          node scripts/mark-beta.mjs _site
      - name: Require bike base map files on beta
        run: |
          if [ ! -s _site/tiles/tiles.json ]; then
            echo "::error title=Missing beta base map::Beta deploy needs tiles/tiles.json. Build tiles and publish a data release with guelph.pmtiles first."
            exit 1
          fi
      # Pages hosts one site per repository, so beta lives in a repository of its own
      # that only ever holds the latest build.
      - name: Publish to the beta site
        env:
          BETA_DEPLOY_KEY: ${{ secrets.BETA_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/beta-key"
          printf '%s\n' "$BETA_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          cd _site
          git init -q -b main
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Beta build of $GITHUB_SHA"
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git push -f git@github.com:Coehill/guelph-bike-parking-beta.git main
      - name: Smoke test the beta site
        run: |
          for i in $(seq 1 20); do
            if curl -fsSL --max-time 10 https://beta.guelph.bike/ | grep -q 'Guelph Bike Parking Map'; then
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Beta site check failed::The beta site did not serve the expected app HTML."
          exit 1

  # The github-pages environment only accepts v* and data-* tags, so GitHub itself
  # refuses a run of this job from main, whatever this file says.
  production:
    if: github.ref_type == 'tag' && (startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'data-'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false # a merge or a second release must never cut off a release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the app and the data can come from different tags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick the app and data releases
        id: pick
        env:
          APP: ${{ inputs.app }}
          DATA: ${{ inputs.data }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          app=${APP:-}
          data=${DATA:-}
          if [[ "$REF_NAME" == v* ]] && [ -z "$app" ]; then app="$REF_NAME"; fi
          if [[ "$REF_NAME" == data-* ]] && [ -z "$data" ]; then data="$REF_NAME"; fi
          if [ -z "$app" ]; then app=$(git tag --list 'v*' --sort=-v:refname | head -1); fi
          if [ -z "$data" ]; then data=$(git tag --list 'data-*' --sort=-v:refname | head -1); fi
          if [ -z "$app" ] || [ -z "$data" ]; then
            echo "::error title=Nothing to publish::The production site needs an app release and a data release."
            exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "data=$data" >> "$GITHUB_OUTPUT"
      - name: Get the base map
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/get-tiles.sh "${{ steps.pick.outputs.data }}"
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: scripts/build-site.sh "${{ steps.pick.outputs.app }}" "${{ steps.pick.outputs.data }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test the production site
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for i in $(seq 1 20); do
            if curl -fsSL --max-time 10 "$url" | grep -q 'Guelph Bike Parking Map'; then
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Production site check failed::The production site did not serve the expected app HTML."
          exit 1
